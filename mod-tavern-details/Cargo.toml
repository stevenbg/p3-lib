[package]
name = "mod-tavern-details"
edition = "2021"
version.workspace = true

[lib]
crate-type = ["cdylib"]
name="tavern_details"

[dependencies]
log = { workspace = true }
win_dbg_logger = { workspace = true }
p3-api = { path = "../p3-api" }
