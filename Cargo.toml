[workspace]
resolver = "2"

members = [
    "aimcli",
    "cprcli",
    "mod-trading-qol",
    "mod-ui-tweaks",
    "mod-battle-always-flee",
    "mod-church-details",
    "mod-crash-reporter",
    "mod-debug-navpoint-matrix",
    "mod-debug-window-lifecycle",
    "mod-fix-bath-house-bribe-blunders",
    "mod-fix-captain-retire-hang",
    "mod-fix-captain-skill-cap-gate",
    "mod-fix-church-anim-crash",
    "mod-fix-damage-to-offside-ship-artillery",
    "mod-fix-feeding-the-poor-wine-price",
    "mod-fix-harbor-fill-oob",
    "mod-fix-invulnerable-ship-artillery-slots",
    "mod-fix-market-hall-production-town",
    "mod-fix-multiplayer-locks",
    "mod-fix-new-settlement-ware-production",
    "mod-fix-patrol-letter-crash",
    "mod-fix-siege-beggar-satisfaction-bonus",
    "mod-fix-texture-cache-thrash",
    "mod-fix-uncompressed-trade-route-loading",
    "mod-hotkey-registry",
    "mod-high-res",
    "mod-high-res-1536x864",
    "mod-high-res-1600x900",
    "mod-high-res-1664x936",
    "mod-increase-alderman-found-settlement-mission-limit",
    "mod-new-settlement-more-production",
    "mod-scrollmap-render-all-ships",
    "mod-shipyard-details",
    "mod-tavern-details",
    "mod-tavern-show-all-sailors",
    "mod-town-hall-details",
    "mod-trading-office-details",
    "mod-trading-office-prices-synchronization",
    "navpointmatrixcli",
    "p2mcli",
    #"p3-agent",
    "p3-agent-loader",
    "p3-aim",
    "p3-aim-sys",
    "p3-api",
    "p3-modloader",
    "p3-ui",
    "p3-rou",
]
exclude = [
]

[workspace.package]
version = "0.1.15"

[workspace.dependencies]
hooklet = "^0.1.8"
clap = { version = "4.3.0", features = ["derive"] }
simple_logger = "4.1"
log = { version = "0.4", features = ["release_max_level_error"] }
sysinfo = "0.29"
win_dbg_logger = "0.1"
num-traits = "0.2"
num-derive = "0.4"
byteorder = "1.5.0"
pathfinding = "4.11.0"
