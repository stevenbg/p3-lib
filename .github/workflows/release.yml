name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # Attaching assets to the release is a write to the repository's contents; without
    # this the token takes the repository's default, which is read-only unless the
    # Actions settings say otherwise, and every upload fails with HTTP 403.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - run: rustup target add i686-pc-windows-msvc
    - run: cargo build --release
    - run: |
        mkdir mods
        mv target/i686-pc-windows-msvc/release/battle_always_flee.dll ./mods/
        mv target/i686-pc-windows-msvc/release/church_details.dll ./mods/
        mv target/i686-pc-windows-msvc/release/crash_reporter.dll ./mods/
        mv target/i686-pc-windows-msvc/release/debug_navpoint_matrix.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_bath_house_bribe_blunders.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_captain_retire_hang.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_captain_skill_cap_gate.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_church_anim_crash.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_damage_to_offside_ship_artillery.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_feeding_the_poor_wine_price.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_harbor_fill_oob.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_invulnerable_ship_artillery_slots.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_market_hall_production_town.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_multiplayer_locks.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_new_settlement_ware_production.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_patrol_letter_crash.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_siege_beggar_satisfaction_bonus.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_texture_cache_thrash.dll ./mods/
        mv target/i686-pc-windows-msvc/release/fix_uncompressed_trade_route_loading.dll ./mods/
        mv target/i686-pc-windows-msvc/release/high_res.dll ./mods/
        mv target/i686-pc-windows-msvc/release/high_res_1664x936.dll ./mods/
        mv target/i686-pc-windows-msvc/release/hotkey_registry.dll ./mods/
        mv target/i686-pc-windows-msvc/release/increase_alderman_found_settlement_mission_limit.dll ./mods/
        mv target/i686-pc-windows-msvc/release/new_settlement_more_production.dll ./mods/
        mv target/i686-pc-windows-msvc/release/scrollmap_render_all_ships.dll ./mods/
        mv target/i686-pc-windows-msvc/release/shipyard_details.dll ./mods/
        mv target/i686-pc-windows-msvc/release/tavern_details.dll ./mods/
        mv target/i686-pc-windows-msvc/release/tavern_show_all_sailors.dll ./mods/
        mv target/i686-pc-windows-msvc/release/town_hall_details.dll ./mods/
        mv target/i686-pc-windows-msvc/release/trading_office_details.dll ./mods/
        mv target/i686-pc-windows-msvc/release/trading_office_prices_synchronization.dll ./mods/
        mv target/i686-pc-windows-msvc/release/trading_qol.dll ./mods/
        mv target/i686-pc-windows-msvc/release/ui_tweaks.dll ./mods/
        Compress-Archive -Path ./mods/* -DestinationPath ./mods.zip
        $release = 'target/i686-pc-windows-msvc/release'
        gh release upload ${{ github.ref_name }} ./mods.zip "$release/aimcli.exe" "$release/cprcli.exe" "$release/mkloadercli.exe" "$release/navpointmatrixcli.exe" "$release/roucli.exe" "$release/p3_modloader.dll"
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}

    # Ready to extract into the game folder: the loader tool and its DLL in the root, the
    # mods in mods\, the fixed patrol mission script in missions_addon\. The mods come from
    # the .\mods the previous step gathered for mods.zip.
    - name: Bundle dist.zip
      run: |
        mkdir dist
        mkdir dist/mods
        mkdir dist/missions_addon
        $release = 'target/i686-pc-windows-msvc/release'
        Copy-Item -Path "$release/mkloadercli.exe", "$release/p3_modloader.dll" -Destination ./dist/
        $bundled = @(
          'battle_always_flee',
          'church_details',
          'crash_reporter',
          'fix_bath_house_bribe_blunders',
          'fix_captain_retire_hang',
          'fix_captain_skill_cap_gate',
          'fix_church_anim_crash',
          'fix_damage_to_offside_ship_artillery',
          'fix_feeding_the_poor_wine_price',
          'fix_harbor_fill_oob',
          'fix_invulnerable_ship_artillery_slots',
          'fix_market_hall_production_town',
          'fix_new_settlement_ware_production',
          'fix_patrol_letter_crash',
          'fix_siege_beggar_satisfaction_bonus',
          'fix_texture_cache_thrash',
          'fix_uncompressed_trade_route_loading',
          'high_res_1664x936',
          'hotkey_registry',
          'shipyard_details',
          'tavern_details',
          'tavern_show_all_sailors',
          'town_hall_details',
          'trading_office_details',
          'trading_qol',
          'ui_tweaks'
        )
        foreach ($mod in $bundled) { Copy-Item "./mods/$mod.dll" -Destination ./dist/mods/ }
        Copy-Item ./mod-fix-patrol-letter-crash/missions_addon/patrouille.p2m -Destination ./dist/missions_addon/
        Compress-Archive -Path ./dist/* -DestinationPath ./dist.zip
        gh release upload ${{ github.ref_name }} ./dist.zip
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
